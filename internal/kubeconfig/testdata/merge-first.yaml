apiVersion: v1
kind: Config
preferences: {}
current-context: alpha
clusters:
  - name: shared-cluster
    cluster:
      server: https://alpha.example
  - name: alpha-cluster
    cluster:
      server: https://alpha-only.example
contexts:
  - name: alpha
    context:
      cluster: alpha-cluster
      user: alpha-user
  - name: shared-context
    context:
      cluster: shared-cluster
      user: shared-user
users:
  - name: alpha-user
    user:
      token: alpha-token
  - name: shared-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
