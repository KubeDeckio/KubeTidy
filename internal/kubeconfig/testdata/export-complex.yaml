apiVersion: v1
kind: Config
preferences: {}
current-context: team-a
clusters:
  - name: team-a-cluster
    cluster:
      server: https://a.example
      tls-server-name: cluster.internal
      proxy-url: http://proxy.internal:8080
  - name: team-b-cluster
    cluster:
      server: https://b.example
contexts:
  - name: team-a
    context:
      cluster: team-a-cluster
      user: team-a-user
      namespace: apps
  - name: team-b
    context:
      cluster: team-b-cluster
      user: team-b-user
users:
  - name: team-a-user
    user:
      token: team-a-token
      extensions:
        - name: user-ext
          extension:
            owner: team-a
  - name: team-b-user
    user:
      token: team-b-token
