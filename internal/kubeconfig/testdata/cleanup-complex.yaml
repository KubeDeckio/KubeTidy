apiVersion: v1
kind: Config
preferences: {}
current-context: keep-ctx
clusters:
  - name: keep
    cluster:
      server: https://keep.example
      proxy-url: socks5://proxy.internal:1080
      tls-server-name: keep.internal
      extensions:
        - name: cluster-ext
          extension:
            owner: platform
  - name: drop
    cluster:
      server: https://drop.example
contexts:
  - name: keep-ctx
    context:
      cluster: keep
      user: shared-user
      namespace: apps
  - name: drop-ctx
    context:
      cluster: drop
      user: drop-user
users:
  - name: shared-user
    user:
      tokenFile: /tmp/keep-token
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
        args:
          - eks
          - get-token
  - name: drop-user
    user:
      auth-provider:
        name: azure
        config:
          tenant-id: tenant
